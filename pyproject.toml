[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "career-kit"
version = "0.1.0"
description = "An on-demand, evidence-based job-search workspace for people and agents"
requires-python = ">=3.11"
dependencies = ["pypdf==6.10.0"]
license = "Apache-2.0"

[project.scripts]
careerkit = "career_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
